apiVersion: audit.k8s.io/v1
kind: Policy

# Keep the log small and readable. We only care about two questions:
#   1. Who mutated a Workflow?          (submit / resume)
#   2. Who mutated a Deployment?        (the actual privileged action)
omitStages:
  - RequestReceived

rules:
  # 1. Workflow mutations -- captures submit (create) and resume (patch/update).
  #    RequestResponse so we can see the resulting object, incl. serviceAccountName.
  - level: RequestResponse
    verbs: ["create", "update", "patch", "delete"]
    resources:
      - group: "argoproj.io"
        resources: ["workflows", "workflowtemplates"]

  # 2. Deployment mutations -- this is what the runner ServiceAccounts do.
  - level: RequestResponse
    verbs: ["update", "patch"]
    resources:
      - group: "apps"
        resources: ["deployments", "deployments/scale"]

  # 3. Denials. Every RBAC rejection lands here -- this is how the
  #    privilege-escalation tests prove enforcement rather than absence.
  - level: Metadata
    verbs: ["create", "update", "patch", "delete"]
    resources:
      - group: "argoproj.io"
      - group: "apps"
      - group: ""
        resources: ["secrets", "pods"]

  # Everything else is noise.
  - level: None
