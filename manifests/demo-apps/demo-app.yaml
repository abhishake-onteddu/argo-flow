# The target of every runbook. Deliberately boring -- Phase 1 is about proving
# the approval gate, not about the application. Phase 2 swaps this for the
# real four-service runbook-demo-platform without touching any RBAC.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: runbook-demo-dev
  labels: { app: demo-app }
spec:
  replicas: 2
  selector:
    matchLabels: { app: demo-app }
  template:
    metadata:
      labels: { app: demo-app }
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 2
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: runbook-demo-dev
spec:
  selector: { app: demo-app }
  ports: [{ port: 80, targetPort: 8080 }]
