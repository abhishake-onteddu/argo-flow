apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-controller-configmap
  namespace: runbooks
data:
  # ---------------------------------------------------------------------------
  # THE LOAD-BEARING CONFIG LINE OF THIS ENTIRE PROJECT.
  #
  # "Secure" forces every Workflow to be a workflowTemplateRef to a
  # pre-existing WorkflowTemplate, AND forbids the submitted spec from
  # overriding anything in it.
  #
  # Without this, an L1 user who can `create workflows` can submit a raw
  # Workflow with `serviceAccountName: runbook-l3-runner` and execute
  # arbitrary privileged actions with no approval gate. The suspend/resume
  # flow becomes decorative.
  #
  # With this, serviceAccountName is pinned inside the WorkflowTemplate,
  # which L1 has no `update workflowtemplates` permission to change.
  # ---------------------------------------------------------------------------
  workflowRestrictions: |
    templateReferencing: Secure

  # Workflow pods run in `argo`. Runner SAs live here too.
  namespaceParallelism: "10"

  # Keep finished workflows around long enough to inspect audit trails.
  retentionPolicy: |
    completed: 20
    failed: 20
    errored: 20

  # ---------------------------------------------------------------------------
  # SSO via Azure Entra ID (hosted OIDC). Read by argo-server with --auth-mode=sso.
  # Argo maps the Entra identity onto an existing ServiceAccount using the
  # `workflows.argoproj.io/rbac-rule` annotations in humans.yaml, then acts AS
  # that SA. NOTE: this weakens the audit trail -- the k8s audit log then records
  # the argo SA, not the human. --auth-mode=client is kept alongside so the
  # strong-audit token path still works.
  #
  # Entra is a public endpoint reachable by both the browser and argo-server
  # (needs cluster egress to login.microsoftonline.com), so there is NO in-cluster
  # IdP, no issuerAlias, and no port-forward for the IdP -- only `make port-forward`
  # for the Argo UI itself.
  #
  # RBAC mapping uses Entra SECURITY GROUPS. The app registration emits a `groups`
  # claim (Token configuration -> Add groups claim -> Security groups), which
  # contains group Object IDs (GUIDs) -- cloud-only Entra groups cannot put names
  # in the token. So the rbac-rules in humans.yaml match on those GUIDs.
  # filterGroupsRegex trims the claim to just our three groups (and sidesteps the
  # >200-group overage limit). See docs/entra-setup.md.
  # ---------------------------------------------------------------------------
  sso: |
    issuer: https://login.microsoftonline.com/913660be-17b8-4873-a229-33b0f747547e/v2.0
    clientId:
      name: argo-server-sso
      key: client-id
    clientSecret:
      name: argo-server-sso
      key: client-secret
    redirectUrl: http://localhost:2746/oauth2/callback
    rbac:
      enabled: true
    filterGroupsRegex:
      - "da9685fc-4f7a-4b8d-aec2-188338b1795b"   # L1
      - "2c23e798-8303-45f9-ba95-ec3cd362b63d"   # L2
      - "6faedd5d-be36-4c63-a7c9-57e7228aa423"   # L3
    scopes:
      - openid
      - email
      - profile
    sessionExpiry: 240h
