# PLACEHOLDER -- not real encrypted data. Regenerate against the running
# sealed-secrets controller with your Entra creds:
#
#   make seal-secret CLIENT_ID=<app-client-id> CLIENT_SECRET=<secret-value>
#
# That overwrites this file with a valid SealedSecret (safe to commit); the
# in-cluster controller decrypts it into the `argo-server-sso` Secret that the
# sso block references.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: argo-server-sso
  namespace: argo
spec:
  encryptedData:
    client-id: PLACEHOLDER_RUN_make_seal-secret
    client-secret: PLACEHOLDER_RUN_make_seal-secret
  template:
    metadata:
      name: argo-server-sso
      namespace: argo
    type: Opaque
