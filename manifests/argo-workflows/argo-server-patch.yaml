# Declarative replacement for the old imperative patches. Strategic merge:
#   - args list is replaced wholesale (sso alongside client, plaintext HTTP)
#   - readiness probe scheme flipped to HTTP so the --secure=false server passes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argo-server
  namespace: argo
spec:
  template:
    spec:
      containers:
        - name: argo-server
          args: ["server", "--auth-mode=sso", "--auth-mode=client", "--secure=false"]
          readinessProbe:
            httpGet:
              scheme: HTTP
