# App-of-apps root. Apply this once (after `make bootstrap` + `make set-repo` +
# git push). ArgoCD reads apps/ -- the four child Applications -- and each of those
# syncs its manifests/<component> directory, in sync-wave order.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: runbook-lab
  namespace: runbookscd
spec:
  project: default
  source:
    repoURL: https://github.com/pt-vamshi/argo-flow.git
    targetRevision: main
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: runbookscd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
